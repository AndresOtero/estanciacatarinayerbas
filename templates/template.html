<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estancia Catarina Yerbas</title>
    <meta name="description" content="Estancia Catarina Yerbas — lista de precios de yerba mate por marca. Precios finales." />
    <style>
        /* ------------------------------------------------------------------
           PALETA
           ------------------------------------------------------------------ */
        :root {
            --verde: #2d5a3a;
            --verde-precio: #1f6e43;
            --verde-suave: #e6f0e9;
            --marron: #b68b6b;
            --marron-oscuro: #3d2c1e;
            --arena: #f0ebe6;
            --arena-media: #e3d7cd;
            --arena-oscura: #e0d6ce;
            --fondo: #f5f0eb;
            --texto: #2d2a27;
            --texto-suave: #4a3f38;
            --texto-tenue: #7a6b5f;
            --texto-placeholder: #b09a8a;
            --ancho-maximo: 1300px;
        }

        /* ------------------------------------------------------------------
           BASE
           ------------------------------------------------------------------ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--fondo);
            padding: 2rem 1rem;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        /* ------------------------------------------------------------------
           ENCABEZADO
           ------------------------------------------------------------------ */
        .header {
            max-width: var(--ancho-maximo);
            margin: 0 auto 2.5rem;
            text-align: center;
        }

        .header h1 {
            display: inline-block;
            font-size: 2.8rem;
            letter-spacing: 1px;
            color: var(--verde);
            border-bottom: 4px solid var(--marron);
            padding-bottom: 0.4rem;
        }

        .header p {
            font-size: 1.2rem;
            color: var(--texto-suave);
            margin-top: 0.6rem;
        }

        /* ------------------------------------------------------------------
           SECCIÓN DE MARCA
           ------------------------------------------------------------------ */
        .brand-section {
            max-width: var(--ancho-maximo);
            margin: 0 auto 3rem;
        }

        .brand-title {
            display: inline-block;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--marron-oscuro);
            background: var(--arena-media);
            border-left: 6px solid var(--verde);
            border-radius: 60px;
            padding: 0.2rem 2.2rem;
            margin-bottom: 1.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem 1.5rem;
        }

        /* ------------------------------------------------------------------
           TARJETA DE PRODUCTO
           ------------------------------------------------------------------ */
        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 1rem 1rem 1.4rem;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.13);
        }

        /* --- Imagen (o placeholder si no hay foto) --- */
        .product-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--arena);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 0.8rem;
        }

        .product-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.03);
        }

        .product-image .no-img {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            word-break: break-word;
            color: var(--texto-placeholder);
            background: var(--arena-oscura);
            padding: 0.5rem;
        }

        /* --- Textos de la tarjeta --- */
        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
            color: var(--texto);
            margin: 0.2rem 0 0.3rem;
            min-height: 2.8rem;
        }

        .product-price {
            display: inline-block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--verde-precio);
            background: var(--verde-suave);
            border-radius: 40px;
            padding: 0.15rem 1.2rem;
            margin-top: 0.2rem;
        }

        .product-price::before {
            content: "$ ";
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--verde);
        }

        .product-weight {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--texto-tenue);
            background: var(--arena);
            border-radius: 30px;
            padding: 0.1rem 0.9rem;
            margin-top: 0.2rem;
        }

        /* ------------------------------------------------------------------
           MÓVIL
           ------------------------------------------------------------------ */
        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .brand-title { font-size: 1.6rem; padding: 0.1rem 1.5rem; }
            .product-grid { gap: 1.2rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <h1>🧉 Estancia Catarina Yerbas</h1>
    <p>Precios finales · Organizado por marca</p>
</header>

<!--CONTENIDO-->

</body>
</html>
