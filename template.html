<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestra Yerba - Tienda</title>
    <meta name="description" content="Lista de precios de yerba mate por marca. Precios finales." />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f5f0eb;
            padding: 2rem 1rem;
        }

        .header {
            max-width: 1300px;
            margin: 0 auto 2.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            color: #2d5a3a;
            letter-spacing: 1px;
            border-bottom: 4px solid #b68b6b;
            display: inline-block;
            padding-bottom: 0.4rem;
        }

        .header p {
            color: #4a3f38;
            font-size: 1.2rem;
            margin-top: 0.6rem;
        }

        /* --- SECCIÓN DE MARCA --- */
        .brand-section {
            max-width: 1300px;
            margin: 0 auto 3rem;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #3d2c1e;
            background: #e3d7cd;
            display: inline-block;
            padding: 0.2rem 2.2rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            border-left: 6px solid #2d5a3a;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 1rem 1.4rem;
            text-align: center;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.13);
        }

        /* --- Contenedor de la imagen --- */
        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f0ebe6;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.8rem;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.03);
        }

        .product-image .no-img {
            color: #b09a8a;
            font-size: 0.85rem;
            font-weight: 500;
            background: #e0d6ce;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.5rem;
            text-align: center;
            word-break: break-word;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #2d2a27;
            margin: 0.2rem 0 0.3rem;
            line-height: 1.3;
            min-height: 2.8rem;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f6e43;
            background: #e6f0e9;
            padding: 0.15rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            margin-top: 0.2rem;
        }

        .product-price::before {
            content: "$ ";
            font-weight: 400;
            font-size: 1.1rem;
            color: #2d5a3a;
        }

        .product-weight {
            font-size: 0.85rem;
            color: #7a6b5f;
            margin-top: 0.2rem;
            background: #f0ebe6;
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 2rem; }
            .brand-title { font-size: 1.6rem; padding: 0.1rem 1.5rem; }
            .product-grid { gap: 1.2rem; }
        }
    </style>
</head>
<body>

<header class="header">
    <h1>🧉 Yerba Mate</h1>
    <p>Precios finales · Organizado por marca</p>
</header>

<!--CONTENIDO-->

</body>
</html>
