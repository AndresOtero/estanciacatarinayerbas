<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestra Yerba - Tienda</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: #f5f0eb;
            padding: 2rem 1rem;
        }

        .header {
            max-width: 1300px;
            margin: 0 auto 2.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            color: #2d5a3a;
            letter-spacing: 1px;
            border-bottom: 4px solid #b68b6b;
            display: inline-block;
            padding-bottom: 0.4rem;
        }

        .header p {
            color: #4a3f38;
            font-size: 1.2rem;
            margin-top: 0.6rem;
        }

        .brand-section {
            max-width: 1300px;
            margin: 0 auto 3rem;
        }

        .brand-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #3d2c1e;
            background: #e3d7cd;
            display: inline-block;
            padding: 0.2rem 2.2rem;
            border-radius: 60px;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            border-left: 6px solid #2d5a3a;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem 1.5rem;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem 1.4rem;
            text-align: center;
            position: relative;
            min-height: 180px;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.13);
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            background: #e6f0e9;
            color: #1f6e43;
            border: 1.5px solid #1f6e43;
            line-height: 1.4;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .stock-badge.sin-stock {
            background: #fde8e8;
            color: #b33c3c;
            border-color: #b33c3c;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.2rem;
            color: #2d2a27;
            margin: 0.4rem 0 0.3rem;
            line-height: 1.3;
            padding-right: 10px;
        }

        .product-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1f6e43;
            background: #e6f0e9;
            padding: 0.15rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            margin-top: 0.4rem;
        }

        .product-price::before {
            content: "$ ";
            font-weight: 400;
            font-size: 1.1rem;
            color: #2d5a3a;
        }

        .product-weight {
            font-size: 0.9rem;
            color: #7a6b5f;
            margin-top: 0.4rem;
            background: #f0ebe6;
            padding: 0.1rem 1rem;
            border-radius: 30px;
            display: inline-block;
        }

        .product-card.sin-stock {
            opacity: 0.7;
        }

        /* FOTO DEL PRODUCTO */
        .product-image-wrap {
            width: 150px;
            height: 150px;
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .photo-input {
            width: 100%;
            max-width: 180px;
            margin-top: 0.7rem;
            font-size: 0.72rem;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2rem;
            }

            .brand-title {
                font-size: 1.6rem;
                padding: 0.1rem 1.5rem;
            }

            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1.2rem;
            }

            .stock-badge {
                font-size: 0.5rem;
                padding: 0.1rem 0.5rem;
                top: 8px;
                right: 8px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🧉 Yerba Mate</h1>
    <p>Precios finales · Stock disponible</p>
</div>

<div id="app"></div>

<script>

    // --------------------------------------------------------------
    // PRODUCTOS
    // --------------------------------------------------------------

    const productos = [

        { nombre: "BALDO UY 1kg", precio: 11000, peso: "1kg", stock: true },

        { nombre: "BALDO UY 5kg", precio: 50500, peso: "5kg", stock: true },

        { nombre: "ESMERALDA 1kg", precio: 12000, peso: "1kg", stock: true },

        { nombre: "REI VERDE Premium 1kg", precio: 10000, peso: "1kg", stock: true },

        { nombre: "PINDARÉ 1kg", precio: 7500, peso: "1kg", stock: false },

        { nombre: "PINDARÉ 100g", precio: 1500, peso: "100g", stock: false },

        { nombre: "VERDECITA 1kg", precio: 7500, peso: "1kg", stock: false },

        { nombre: "LATINA 1kg", precio: 7500, peso: "1kg", stock: false },

        { nombre: "CENTENARIA 1kg", precio: 7500, peso: "1kg", stock: false },

        { nombre: "CENTENARIA Essencial 1kg", precio: 7000, peso: "1kg", stock: false },

        { nombre: "SARA Tradicional 1kg", precio: 11000, peso: "1kg", stock: false },

        { nombre: "SARA Extra-Suave 1kg", precio: 11000, peso: "1kg", stock: false },

        { nombre: "SARA Compuesta 1kg", precio: 11000, peso: "1kg", stock: false },

        { nombre: "BARÃO Tradicional 1kg", precio: 8500, peso: "1kg", stock: false },

        { nombre: "CANARIAS Tradicional 1kg", precio: 10500, peso: "1kg", stock: false },

        { nombre: "CANARIAS Serena 1kg", precio: 11500, peso: "1kg", stock: false },

        { nombre: "CANARIAS Edición Especial 1kg", precio: 11500, peso: "1kg", stock: false },

        { nombre: "CANARIAS Té Verde y Jengibre 1kg", precio: 11500, peso: "1kg", stock: false },

        { nombre: "CANARIAS Té Rojo y Centella 1kg", precio: 12500, peso: "1kg", stock: false },

        { nombre: "CANARIAS Suave 1kg", precio: 12500, peso: "1kg", stock: false },

        { nombre: "CONTIGO Tradicional 1kg", precio: 12000, peso: "1kg", stock: false },

        { nombre: "REI VERDE Tradicional 1kg", precio: 8500, peso: "1kg", stock: false },

        { nombre: "REI VERDE Classica 1kg", precio: 7500, peso: "1kg", stock: false },

        { nombre: "REI VERDE Padrón Argentino 1kg", precio: 7500, peso: "1kg", stock: false },


        // ----------------------------------------------------------
        // ACCESORIOS
        // ----------------------------------------------------------

        {
            nombre: "Lata Baldo",
            precio: 20000,
            peso: "Accesorio",
            stock: true,
            categoria: "Accesorios"
        },

        {
            nombre: "Yerbera de cuero",
            precio: 10000,
            peso: "Accesorio",
            stock: true,
            categoria: "Accesorios"
        }

    ];


    // --------------------------------------------------------------
    // FILTRO
    // --------------------------------------------------------------

    const productosFiltrados = productos.filter(
        p => !p.nombre.includes("500g")
    );


    // --------------------------------------------------------------
    // MARCAS
    // --------------------------------------------------------------

    const marcasConocidas = [

        "REI VERDE",

        "Emperatriz del Monte",

        "CANARIAS",

        "CENTENARIA",

        "PINDARÉ",

        "VERDECITA",

        "BALDO",

        "ESMERALDA",

        "LATINA",

        "SARA",

        "BARÃO",

        "CONTIGO",

        "CÓSMICO"

    ].sort((a, b) => b.length - a.length);


    function obtenerMarca(nombreProducto) {

        for (let marca of marcasConocidas) {

            if (
                nombreProducto.startsWith(marca + " ")
                ||
                nombreProducto === marca
            ) {

                return marca;

            }

        }

        return nombreProducto.split(" ")[0];

    }


    // --------------------------------------------------------------
    // AGRUPAR PRODUCTOS
    // --------------------------------------------------------------

    const grouped = {};


    productosFiltrados.forEach(p => {

        const grupo =
            p.categoria
            ||
            obtenerMarca(p.nombre);


        if (!grouped[grupo]) {

            grouped[grupo] = [];

        }


        grouped[grupo].push(p);

    });


    // --------------------------------------------------------------
    // ORDEN
    // --------------------------------------------------------------

    const marcasOrdenadas =
        Object.keys(grouped).sort((a, b) => {

            if (a === "Accesorios") return 1;

            if (b === "Accesorios") return -1;

            return a.localeCompare(b);

        });


    // --------------------------------------------------------------
    // RENDERIZAR
    // --------------------------------------------------------------

    const app = document.getElementById("app");


    marcasOrdenadas.forEach(marca => {

        const productosDeMarca =
            grouped[marca];


        const section =
            document.createElement("div");

        section.className =
            "brand-section";


        const title =
            document.createElement("h2");

        title.className =
            "brand-title";

        title.textContent =
            marca;


        section.appendChild(title);


        const grid =
            document.createElement("div");

        grid.className =
            "product-grid";


        productosDeMarca.forEach(p => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";


            if (!p.stock) {

                card.classList.add(
                    "sin-stock"
                );

            }


            // ------------------------------------------------------
            // BADGE STOCK
            // ------------------------------------------------------

            const badge =
                document.createElement("div");

            badge.className =
                "stock-badge"
                +
                (p.stock
                    ? ""
                    : " sin-stock");


            badge.textContent =
                p.stock
                    ? "✅ En stock"
                    : "❌ Sin stock";


            // ------------------------------------------------------
            // IMAGEN
            // ------------------------------------------------------

            const imageWrap =
                document.createElement("div");

            imageWrap.className =
                "product-image-wrap";


            const img =
                document.createElement("img");

            img.className =
                "product-image";

            img.alt =
                `Foto de ${p.nombre}`;

            img.style.display =
                "none";


            // ------------------------------------------------------
            // BOTÓN PARA SUBIR FOTO
            // ------------------------------------------------------

            const photoInput =
                document.createElement("input");

            photoInput.type =
                "file";

            photoInput.accept =
                "image/*";

            photoInput.className =
                "photo-input";

            photoInput.title =
                "Elegir foto del producto";


            photoInput.addEventListener(
                "change",
                event => {

                    const file =
                        event.target.files[0];


                    if (!file) return;


                    const reader =
                        new FileReader();


                    reader.onload =
                        e => {

                            img.src =
                                e.target.result;

                            img.style.display =
                                "block";

                        };


                    reader.readAsDataURL(file);

                }
            );


            imageWrap.appendChild(img);


            // ------------------------------------------------------
            // INFORMACIÓN DEL PRODUCTO
            // ------------------------------------------------------

            card.innerHTML = `

                <div class="product-name">
                    ${p.nombre}
                </div>

                <div class="product-price">
                    ${p.precio.toLocaleString("es-UY")}
                </div>

                <div class="product-weight">
                    ${p.peso}
                </div>

            `;


            card.prepend(
                badge
            );


            card.prepend(
                imageWrap
            );


            card.appendChild(
                photoInput
            );


            grid.appendChild(
                card
            );

        });


        section.appendChild(
            grid
        );


        app.appendChild(
            section
        );

    });


    console.log(
        `✅ ${productosFiltrados.length} productos cargados`
    );

</script>

</body>
</html>
