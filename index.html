<style>
:root{
  --verde-900:#1a3d28;
  --verde-700:#22543a;
  --verde-600:#2d5a3a;
  --verde-500:#3a7350;
  --verde-100:#e6f0e9;
  --terracota:#b68b6b;
  --terracota-dark:#96694b;
  --crema:#f7f2ec;
  --crema-2:#efe6db;
  --texto:#2a2420;
  --texto-suave:#7a6b5f;
  --rojo:#b33c3c;
  --rojo-bg:#fdeaea;
  --verde-ok:#1f6e43;
  --verde-ok-bg:#e6f0e9;
  --ambar:#a06a12;
  --ambar-bg:#fdf1de;
  --sombra: 0 10px 30px rgba(26,61,40,0.10);
  --sombra-hover: 0 20px 40px rgba(26,61,40,0.16);
  --radius: 22px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--texto);
  background:
    radial-gradient(circle at 15% 0%, rgba(58,115,80,0.07), transparent 45%),
    radial-gradient(circle at 100% 20%, rgba(182,139,107,0.10), transparent 40%),
    var(--crema);
  min-height:100vh;
  padding-bottom:4rem;
}
h1,h2,h3{font-family:'Fraunces',serif;}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  background:
    linear-gradient(160deg, var(--verde-900) 0%, var(--verde-700) 55%, var(--verde-600) 100%);
  color:#fdfaf6;
  padding:3rem 1.5rem 5.2rem;
  overflow:hidden;
  border-bottom:6px solid var(--terracota);
}
.hero::before{
  content:"";
  position:absolute; inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
  background-size: 22px 22px;
  opacity:.35;
  pointer-events:none;
}
.hero-inner{
  position:relative;
  max-width:1300px;
  margin:0 auto;
  text-align:center;
}
.hero-logo{
  width:76px;
  height:76px;
  object-fit:contain;
  border-radius:50%;
  background:#fdfaf6;
  padding:8px;
  box-shadow:0 8px 22px rgba(0,0,0,0.25);
  margin-bottom:.9rem;
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  padding:.4rem 1.1rem;
  border-radius:40px;
  font-size:.82rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:600;
  backdrop-filter: blur(4px);
}
.hero h1{
  font-size:clamp(2.4rem, 5vw, 3.6rem);
  font-weight:700;
  margin:1rem 0 .6rem;
  letter-spacing:.3px;
}
.hero p.sub{
  font-size:1.15rem;
  max-width:620px;
  margin:0 auto;
  color:#e9f1ea;
  opacity:.9;
}
.hero .linea{
  width:70px; height:4px;
  background:var(--terracota);
  border-radius:10px;
  margin:1.4rem auto 0;
}

/* ---------- BARRA DE CONTROLES (sticky) ---------- */
.controls-wrap{
  max-width:1300px;
  margin:-2.6rem auto 2.6rem;
  padding:0 1.5rem;
  position:relative;
  z-index:5;
}
.controls{
  background:#fff;
  border-radius:24px;
  box-shadow: var(--sombra);
  padding:1.1rem 1.3rem;
  display:flex;
  flex-wrap:wrap;
  gap:1rem;
  align-items:center;
}
.search-box{
  flex:1 1 260px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:.85rem 1.1rem .85rem 2.6rem;
  border-radius:14px;
  border:1.5px solid var(--crema-2);
  background:var(--crema);
  font-size:1rem;
  font-family:inherit;
  color:var(--texto);
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-box input:focus{
  border-color:var(--verde-500);
  box-shadow:0 0 0 4px rgba(58,115,80,0.12);
}
.search-box::before{
  content:"🔍";
  position:absolute;
  left:.9rem; top:50%;
  transform:translateY(-50%);
  font-size:1rem;
  opacity:.6;
}
.filter-pills{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
}
.pill{
  border:1.5px solid var(--crema-2);
  background:var(--crema);
  color:var(--texto-suave);
  padding:.6rem 1.1rem;
  border-radius:40px;
  font-size:.88rem;
  font-weight:600;
  cursor:pointer;
  transition:all .18s ease;
  white-space:nowrap;
}
.pill:hover{ border-color:var(--verde-500); color:var(--verde-700); }
.pill.active{
  background:var(--verde-700);
  border-color:var(--verde-700);
  color:#fff;
  box-shadow:0 6px 16px rgba(34,84,58,0.25);
}
.result-count{
  font-size:.85rem;
  color:var(--texto-suave);
  margin-top:.7rem;
  padding-left:.2rem;
}

/* ---------- INDICE DE MARCAS ---------- */
.brand-nav{
  max-width:1300px;
  margin:0 auto 2.6rem;
  padding:0 1.5rem;
  display:flex;
  gap:.55rem;
  flex-wrap:wrap;
  justify-content:center;
}
.brand-nav a{
  text-decoration:none;
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.03em;
  color:var(--verde-700);
  background:var(--verde-100);
  padding:.45rem .9rem;
  border-radius:30px;
  border:1px solid rgba(45,90,58,0.15);
  transition:transform .15s, background .15s;
  text-transform:uppercase;
}
.brand-nav a:hover{
  background:var(--verde-700);
  color:#fff;
  transform:translateY(-2px);
}

/* ---------- SECCIONES DE MARCA ---------- */
.contenido{
  max-width:1300px;
  margin:0 auto;
  padding:0 1.5rem;
}
.brand-section{
  margin-bottom:3rem;
  scroll-margin-top:1.5rem;
}
.brand-header{
  display:flex;
  align-items:baseline;
  gap:1rem;
  margin-bottom:1.4rem;
  flex-wrap:wrap;
}
.brand-title{
  font-size:1.7rem;
  font-weight:700;
  color:var(--verde-900);
  position:relative;
  padding-left:1rem;
  border-left:5px solid var(--terracota);
  text-transform:uppercase;
}
.brand-count{
  font-size:.82rem;
  color:var(--texto-suave);
  background:var(--crema-2);
  padding:.25rem .7rem;
  border-radius:20px;
  font-weight:600;
}

/* ---------- GRID Y TARJETAS ---------- */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(215px, 1fr));
  gap:1.4rem;
}
.product-card{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--sombra);
  padding:1.3rem 1.1rem 1.2rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;
  border:1px solid rgba(45,90,58,0.06);
  transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;
  animation:fadeIn .5s ease both;
  overflow:visible;
}
.product-card:hover{
  transform:translateY(-8px);
  box-shadow:var(--sombra-hover);
}
.product-card.sin-stock{ opacity:.72; }
.product-card.sin-stock .product-image-wrap img{ filter:grayscale(35%); }

@keyframes fadeIn{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}

.stock-badge{
  position:absolute;
  top:12px; right:12px;
  z-index:6;
  font-size:.62rem;
  font-weight:700;
  padding:.22rem .65rem;
  border-radius:40px;
  text-transform:uppercase;
  letter-spacing:.03em;
  background:var(--verde-ok-bg);
  color:var(--verde-ok);
  border:1.4px solid var(--verde-ok);
  box-shadow:0 2px 8px rgba(0,0,0,0.10);
  white-space:nowrap;
}
.stock-badge.sin-stock{
  background:var(--rojo-bg);
  color:var(--rojo);
  border-color:var(--rojo);
}
.stock-badge.pedido{
  background:var(--ambar-bg);
  color:var(--ambar);
  border-color:var(--ambar);
}

.product-image-wrap{
  width:150px;
  height:150px;
  margin:1.7rem 0 .85rem;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}
.product-image-wrap img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:14px;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,0.14));
  transition:transform .3s ease;
}
.product-card:hover .product-image-wrap img{ transform:scale(1.05) rotate(-1deg); }

.no-photo{
  width:100%; height:100%;
  border-radius:14px;
  background:linear-gradient(160deg, var(--crema-2), var(--crema));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.2rem;
  color:var(--verde-500);
  opacity:.6;
}

.product-name{
  font-weight:700;
  font-size:1.06rem;
  color:var(--texto);
  margin:.2rem 0 .35rem;
  line-height:1.3;
}
.product-price{
  font-size:1.55rem;
  font-weight:800;
  color:var(--verde-ok);
  background:var(--verde-ok-bg);
  padding:.15rem 1.1rem;
  border-radius:40px;
  display:inline-block;
  margin-top:.3rem;
  letter-spacing:-.02em;
}
.product-price::before{
  content:"$ ";
  font-weight:400;
  font-size:1rem;
  color:var(--verde-700);
}
.product-weight{
  font-size:.85rem;
  color:var(--texto-suave);
  margin-top:.5rem;
  background:var(--crema-2);
  padding:.15rem 1rem;
  border-radius:30px;
  display:inline-block;
  font-weight:500;
}

.no-results{
  text-align:center;
  padding:4rem 1rem;
  color:var(--texto-suave);
  font-size:1.05rem;
}

/* ---------- FOOTER ---------- */
footer{
  max-width:1300px;
  margin:3rem auto 0;
  padding:2rem 1.5rem 0;
  text-align:center;
  color:var(--texto-suave);
  font-size:.85rem;
  border-top:1px solid rgba(45,90,58,0.12);
}
footer strong{ color:var(--verde-700); }
.social-row{
  display:flex;
  justify-content:center;
  margin-bottom:1.2rem;
}
.social-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);
  box-shadow:0 8px 20px rgba(221,42,123,0.28);
  transition:transform .2s ease, box-shadow .2s ease;
}
.social-link:hover{
  transform:translateY(-4px) scale(1.06);
  box-shadow:0 12px 26px rgba(221,42,123,0.38);
}
.social-link svg{
  width:24px;
  height:24px;
  fill:#fff;
}

@media (max-width:600px){
  .hero{ padding:2.6rem 1.2rem 4rem; }
  .hero h1{ font-size:2rem; }
  .controls{ padding:.9rem; }
  .brand-title{ font-size:1.35rem; }
  .product-grid{
    grid-template-columns:repeat(auto-fill, minmax(155px, 1fr));
    gap:1rem;
  }
  .stock-badge{ font-size:.55rem; padding:.15rem .5rem; top:9px; right:9px; }
}
</style>
</head>
<body>

    "ESMERALDA 1kg": IMAGENES.esmeralda,
    "REI VERDE Premium 1kg": IMAGENES.reiverde,
    "REI VERDE Classica 1kg": IMAGENES.reiverde_classica,
    "REI VERDE Padrón Argentino 1kg": IMAGENES.reiverde_padron,
    "CENTENARIA 1kg": IMAGENES.centenaria,
    "CENTENARIA Essencial 1kg": IMAGENES.centenaria_esencial,
    "CANARIAS Serena 1kg": IMAGENES.canarias_serena,
    "CANARIAS Tradicional 1kg": IMAGENES.canarias_tradicional,
    "CANARIAS Suave 1kg": IMAGENES.canarias_suave,
    "CANARIAS Edición Especial 1kg": IMAGENES.canarias_especial,
    "CANARIAS Té Verde y Jengibre 1kg": IMAGENES.canarias_te_verde,
    "VERDECITA 1kg": IMAGENES.verdecita,
    "LATINA 1kg": IMAGENES.latina,
    "BARÃO Tradicional 1kg": IMAGENES.barao,
    "PINDARÉ 1kg": IMAGENES.pindare_1kg,
    "PINDARÉ 100g": IMAGENES.pindare_100g,
    "SARA Tradicional 1kg": IMAGENES.sara_tradicional,
    "SARA Extra-Suave 1kg": IMAGENES.sara_extra_suave,
    "SARA Compuesta 1kg": IMAGENES.sara_compuesta,
    "SARA Coco": IMAGENES.sara,
    "REI VERDE Tradicional 1kg": IMAGENES.reiverde_tradicional,
    "CONTIGO Tradicional 1kg": IMAGENES.contigo,
    "CANARIAS Té Rojo y Centella 1kg": IMAGENES.canarias_te_rojo,
    "Yerbera de cuero": IMAGENES.yerbera_cuero
};

const productosFiltrados = productos.filter(p => !p.nombre.includes("500g"));

const marcasConocidas = [
    "REI VERDE", "Emperatriz del Monte", "CANARIAS", "CENTENARIA", "PINDARÉ",
    "VERDECITA", "BALDO", "ESMERALDA", "LATINA", "SARA", "BARÃO", "CONTIGO", "CÓSMICO"
].sort((a, b) => b.length - a.length);

function obtenerMarca(nombreProducto) {
    for (let marca of marcasConocidas) {
        if (nombreProducto.startsWith(marca + " ") || nombreProducto === marca) return marca;
    }
    return nombreProducto.split(" ")[0];
}

function obtenerImagen(p) {
    return imagenPorProducto[p.nombre] || null;
}

const grouped = {};
productosFiltrados.forEach(p => {
    const grupo = p.categoria || obtenerMarca(p.nombre);
    if (!grouped[grupo]) grouped[grupo] = [];
    grouped[grupo].push(p);
});

const marcasOrdenadas = Object.keys(grouped).sort((a, b) => {
    if (a === "Accesorios") return 1;
    if (b === "Accesorios") return -1;
    return a.localeCompare(b);
});

const app = document.getElementById("app");
const brandNav = document.getElementById("brandNav");
const contador = document.getElementById("contador");

let filtroActual = "todos";
let textoBusqueda = "";

const ESTADO_INFO = {
    "stock": { texto: "✅ En stock", clase: "" },
    "sin-stock": { texto: "❌ Sin stock", clase: "sin-stock" },
    "pedido": { texto: "🕒 A pedido", clase: "pedido" }
};

function slugify(str){
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
}

function crearTarjeta(p){
    const info = ESTADO_INFO[p.estado] || ESTADO_INFO["stock"];
    const card = document.createElement("div");
    card.className = "product-card" + (info.clase ? " " + info.clase : "");
    card.dataset.nombre = p.nombre.toLowerCase();
    card.dataset.estado = p.estado;

    const badge = document.createElement("div");
    badge.className = "stock-badge" + (info.clase ? " " + info.clase : "");
    badge.textContent = info.texto;

    const imageWrap = document.createElement("div");
    imageWrap.className = "product-image-wrap";

    const imgSrc = obtenerImagen(p);
    if (imgSrc){
        const img = document.createElement("img");
        img.alt = `Foto de ${p.nombre}`;
        img.src = imgSrc;
        imageWrap.appendChild(img);
    } else {
        const placeholder = document.createElement("div");
        placeholder.className = "no-photo";
        placeholder.textContent = "🧉";
        imageWrap.appendChild(placeholder);
    }

    card.appendChild(badge);
    card.appendChild(imageWrap);

    const info2 = document.createElement("div");
    info2.innerHTML = `
        <div class="product-name">${p.nombre}</div>
        <div class="product-price">${p.precio.toLocaleString("es-UY")}</div>
        <div class="product-weight">${p.peso}</div>
    `;
    card.appendChild(info2);

    return card;
}

function render(){
    app.innerHTML = "";
    brandNav.innerHTML = "";
    let totalVisibles = 0;

    marcasOrdenadas.forEach(marca => {
        const productosDeMarca = grouped[marca].filter(p => {
            const coincideTexto = p.nombre.toLowerCase().includes(textoBusqueda) || marca.toLowerCase().includes(textoBusqueda);
            const coincideFiltro = filtroActual === "todos" || p.estado === filtroActual;
            return coincideTexto && coincideFiltro;
        });

        if (productosDeMarca.length === 0) return;
        totalVisibles += productosDeMarca.length;

        const slug = slugify(marca);

        const navLink = document.createElement("a");
        navLink.href = "#" + slug;
        navLink.textContent = marca;
        brandNav.appendChild(navLink);

        const section = document.createElement("div");
        section.className = "brand-section";
        section.id = slug;

        const header = document.createElement("div");
        header.className = "brand-header";
        header.innerHTML = `
            <h2 class="brand-title">${marca}</h2>
            <span class="brand-count">${productosDeMarca.length} producto${productosDeMarca.length !== 1 ? "s" : ""}</span>
        `;
        section.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "product-grid";
        productosDeMarca.forEach(p => grid.appendChild(crearTarjeta(p)));
        section.appendChild(grid);

        app.appendChild(section);
    });

    if (totalVisibles === 0){
        app.innerHTML = `<div class="no-results">😕 No encontramos productos que coincidan con tu búsqueda.</div>`;
    }
    contador.textContent = `${totalVisibles} producto${totalVisibles !== 1 ? "s" : ""} encontrado${totalVisibles !== 1 ? "s" : ""}`;
}

document.getElementById("buscador").addEventListener("input", e => {
    textoBusqueda = e.target.value.toLowerCase().trim();
    render();
});

document.querySelectorAll("#filtros .pill").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll("#filtros .pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filtroActual = btn.dataset.filtro;
        render();
    });
});

render();
console.log(`✅ ${productosFiltrados.length} productos cargados`);
</script>

</body>
</html>
