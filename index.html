<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nuestra Yerba · Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde-900:#1a3d28;
  --verde-700:#22543a;
  --verde-600:#2d5a3a;
  --verde-500:#3a7350;
  --verde-100:#e6f0e9;
  --terracota:#b68b6b;
  --terracota-dark:#96694b;
  --crema:#f7f2ec;
  --crema-2:#efe6db;
  --texto:#2a2420;
  --texto-suave:#7a6b5f;
  --rojo:#b33c3c;
  --rojo-bg:#fdeaea;
  --verde-ok:#1f6e43;
  --verde-ok-bg:#e6f0e9;
  --sombra: 0 10px 30px rgba(26,61,40,0.10);
  --sombra-hover: 0 20px 40px rgba(26,61,40,0.16);
  --radius: 22px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',system-ui,sans-serif;
  color:var(--texto);
  background:
    radial-gradient(circle at 15% 0%, rgba(58,115,80,0.07), transparent 45%),
    radial-gradient(circle at 100% 20%, rgba(182,139,107,0.10), transparent 40%),
    var(--crema);
  min-height:100vh;
  padding-bottom:4rem;
}
h1,h2,h3{font-family:'Fraunces',serif;}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  background:
    linear-gradient(160deg, var(--verde-900) 0%, var(--verde-700) 55%, var(--verde-600) 100%);
  color:#fdfaf6;
  padding:3.6rem 1.5rem 5.2rem;
  overflow:hidden;
  border-bottom:6px solid var(--terracota);
}
.hero::before{
  content:"";
  position:absolute; inset:0;
  background-image: radial-gradient(rgba(255,255,255,0.10) 1.5px, transparent 1.5px);
  background-size: 22px 22px;
  opacity:.35;
  pointer-events:none;
}
.hero-inner{
  position:relative;
  max-width:1300px;
  margin:0 auto;
  text-align:center;
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.35);
  padding:.4rem 1.1rem;
  border-radius:40px;
  font-size:.82rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:600;
  backdrop-filter: blur(4px);
}
.hero h1{
  font-size:clamp(2.4rem, 5vw, 3.6rem);
  font-weight:700;
  margin:1rem 0 .6rem;
  letter-spacing:.3px;
}
.hero p.sub{
  font-size:1.15rem;
  color:#e4ecd f;
  opacity:.9;
  max-width:620px;
  margin:0 auto;
  color:#e9f1ea;
}
.hero .linea{
  width:70px; height:4px;
  background:var(--terracota);
  border-radius:10px;
  margin:1.4rem auto 0;
}

/* ---------- BARRA DE CONTROLES (sticky) ---------- */
.controls-wrap{
  max-width:1300px;
  margin:-2.6rem auto 2.6rem;
  padding:0 1.5rem;
  position:relative;
  z-index:5;
}
.controls{
  background:#fff;
  border-radius:24px;
  box-shadow: var(--sombra);
  padding:1.1rem 1.3rem;
  display:flex;
  flex-wrap:wrap;
  gap:1rem;
  align-items:center;
}
.search-box{
  flex:1 1 260px;
  position:relative;
}
.search-box input{
  width:100%;
  padding:.85rem 1.1rem .85rem 2.6rem;
  border-radius:14px;
  border:1.5px solid var(--crema-2);
  background:var(--crema);
  font-size:1rem;
  font-family:inherit;
  color:var(--texto);
  outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-box input:focus{
  border-color:var(--verde-500);
  box-shadow:0 0 0 4px rgba(58,115,80,0.12);
}
.search-box::before{
  content:"🔍";
  position:absolute;
  left:.9rem; top:50%;
  transform:translateY(-50%);
  font-size:1rem;
  opacity:.6;
}
.filter-pills{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
}
.pill{
  border:1.5px solid var(--crema-2);
  background:var(--crema);
  color:var(--texto-suave);
  padding:.6rem 1.1rem;
  border-radius:40px;
  font-size:.88rem;
  font-weight:600;
  cursor:pointer;
  transition:all .18s ease;
  white-space:nowrap;
}
.pill:hover{ border-color:var(--verde-500); color:var(--verde-700); }
.pill.active{
  background:var(--verde-700);
  border-color:var(--verde-700);
  color:#fff;
  box-shadow:0 6px 16px rgba(34,84,58,0.25);
}
.result-count{
  font-size:.85rem;
  color:var(--texto-suave);
  margin-top:.7rem;
  padding-left:.2rem;
}

/* ---------- INDICE DE MARCAS ---------- */
.brand-nav{
  max-width:1300px;
  margin:0 auto 2.6rem;
  padding:0 1.5rem;
  display:flex;
  gap:.55rem;
  flex-wrap:wrap;
  justify-content:center;
}
.brand-nav a{
  text-decoration:none;
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.03em;
  color:var(--verde-700);
  background:var(--verde-100);
  padding:.45rem .9rem;
  border-radius:30px;
  border:1px solid rgba(45,90,58,0.15);
  transition:transform .15s, background .15s;
}
.brand-nav a:hover{
  background:var(--verde-700);
  color:#fff;
  transform:translateY(-2px);
}

/* ---------- SECCIONES DE MARCA ---------- */
.contenido{
  max-width:1300px;
  margin:0 auto;
  padding:0 1.5rem;
}
.brand-section{
  margin-bottom:3rem;
  scroll-margin-top:1.5rem;
}
.brand-header{
  display:flex;
  align-items:baseline;
  gap:1rem;
  margin-bottom:1.4rem;
  flex-wrap:wrap;
}
.brand-title{
  font-size:1.7rem;
  font-weight:700;
  color:var(--verde-900);
  position:relative;
  padding-left:1rem;
  border-left:5px solid var(--terracota);
}
.brand-count{
  font-size:.82rem;
  color:var(--texto-suave);
  background:var(--crema-2);
  padding:.25rem .7rem;
  border-radius:20px;
  font-weight:600;
}

/* ---------- GRID Y TARJETAS ---------- */
.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(215px, 1fr));
  gap:1.4rem;
}
.product-card{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--sombra);
  padding:1.3rem 1.1rem 1.2rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  position:relative;
  border:1px solid rgba(45,90,58,0.06);
  transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;
  animation:fadeIn .5s ease both;
}
.product-card:hover{
  transform:translateY(-8px);
  box-shadow:var(--sombra-hover);
}
.product-card.sin-stock{ opacity:.72; }
.product-card.sin-stock .product-image-wrap img{ filter:grayscale(35%); }

@keyframes fadeIn{
  from{opacity:0; transform:translateY(14px);}
  to{opacity:1; transform:translateY(0);}
}

.stock-badge{
  position:absolute;
  top:12px; right:12px;
  font-size:.62rem;
  font-weight:700;
  padding:.22rem .65rem;
  border-radius:40px;
  text-transform:uppercase;
  letter-spacing:.03em;
  background:var(--verde-ok-bg);
  color:var(--verde-ok);
  border:1.4px solid var(--verde-ok);
  box-shadow:0 1px 4px rgba(0,0,0,0.05);
}
.stock-badge.sin-stock{
  background:var(--rojo-bg);
  color:var(--rojo);
  border-color:var(--rojo);
}

.product-image-wrap{
  width:150px;
  height:150px;
  margin-bottom:.85rem;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.product-image-wrap img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  border-radius:14px;
  filter:drop-shadow(0 10px 14px rgba(0,0,0,0.14));
  transition:transform .3s ease;
}
.product-card:hover .product-image-wrap img{ transform:scale(1.05) rotate(-1deg); }

.no-photo{
  width:100%; height:100%;
  border-radius:14px;
  background:linear-gradient(160deg, var(--crema-2), var(--crema));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.2rem;
  color:var(--verde-500);
  opacity:.6;
}

.photo-input{
  width:100%;
  max-width:180px;
  margin-top:.6rem;
  font-size:.66rem;
  color:var(--texto-suave);
}
.photo-input::file-selector-button{
  border:none;
  background:var(--verde-100);
  color:var(--verde-700);
  padding:.3rem .6rem;
  border-radius:20px;
  font-size:.65rem;
  font-weight:600;
  margin-right:.5rem;
  cursor:pointer;
}

.product-name{
  font-weight:700;
  font-size:1.06rem;
  color:var(--texto);
  margin:.2rem 0 .35rem;
  line-height:1.3;
}
.product-price{
  font-size:1.55rem;
  font-weight:800;
  color:var(--verde-ok);
  background:var(--verde-ok-bg);
  padding:.15rem 1.1rem;
  border-radius:40px;
  display:inline-block;
  margin-top:.3rem;
  letter-spacing:-.02em;
}
.product-price::before{
  content:"$ ";
  font-weight:400;
  font-size:1rem;
  color:var(--verde-700);
}
.product-weight{
  font-size:.85rem;
  color:var(--texto-suave);
  margin-top:.5rem;
  background:var(--crema-2);
  padding:.15rem 1rem;
  border-radius:30px;
  display:inline-block;
  font-weight:500;
}

.no-results{
  text-align:center;
  padding:4rem 1rem;
  color:var(--texto-suave);
  font-size:1.05rem;
}

/* ---------- FOOTER ---------- */
footer{
  max-width:1300px;
  margin:3rem auto 0;
  padding:2rem 1.5rem 0;
  text-align:center;
  color:var(--texto-suave);
  font-size:.85rem;
  border-top:1px solid rgba(45,90,58,0.12);
}
footer strong{ color:var(--verde-700); }

@media (max-width:600px){
  .hero{ padding:2.6rem 1.2rem 4rem; }
  .hero h1{ font-size:2rem; }
  .controls{ padding:.9rem; }
  .brand-title{ font-size:1.35rem; }
  .product-grid{
    grid-template-columns:repeat(auto-fill, minmax(155px, 1fr));
    gap:1rem;
  }
  .stock-badge{ font-size:.55rem; padding:.15rem .5rem; top:9px; right:9px; }
}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <span class="hero-badge">🧉 Sabor uruguayo, todos los días</span>
    <h1>Nuestra Yerba</h1>
    <p class="sub">Yerbas seleccionadas de Uruguay y Brasil, precios finales y stock siempre actualizado.</p>
    <div class="linea"></div>
  </div>
</div>

<div class="controls-wrap">
  <div class="controls">
    <div class="search-box">
      <input type="text" id="buscador" placeholder="Buscar por nombre o marca...">
    </div>
    <div class="filter-pills" id="filtros">
      <button class="pill active" data-filtro="todos">Todos</button>
      <button class="pill" data-filtro="stock">✅ En stock</button>
      <button class="pill" data-filtro="sin-stock">❌ Sin stock</button>
    </div>
  </div>
  <div class="result-count" id="contador"></div>
</div>

<nav class="brand-nav" id="brandNav"></nav>

<div class="contenido" id="app"></div>

<footer>
  <p>🧉 <strong>Nuestra Yerba</strong> · Catálogo actualizado · Los precios pueden variar sin previo aviso</p>
</footer>

    { nombre: "CENTENARIA Essencial 1kg", precio: 7000, peso: "1kg", stock: false },
    { nombre: "SARA Tradicional 1kg", precio: 11000, peso: "1kg", stock: false },
    { nombre: "SARA Extra-Suave 1kg", precio: 11000, peso: "1kg", stock: false },
    { nombre: "SARA Compuesta 1kg", precio: 11000, peso: "1kg", stock: false },
    { nombre: "BARÃO Tradicional 1kg", precio: 8500, peso: "1kg", stock: false },
    { nombre: "CANARIAS Tradicional 1kg", precio: 10500, peso: "1kg", stock: false },
    { nombre: "CANARIAS Serena 1kg", precio: 11500, peso: "1kg", stock: false },
    { nombre: "CANARIAS Edición Especial 1kg", precio: 11500, peso: "1kg", stock: false },
    { nombre: "CANARIAS Té Verde y Jengibre 1kg", precio: 11500, peso: "1kg", stock: false },
    { nombre: "CANARIAS Té Rojo y Centella 1kg", precio: 12500, peso: "1kg", stock: false },
    { nombre: "CANARIAS Suave 1kg", precio: 12500, peso: "1kg", stock: false },
    { nombre: "CONTIGO Tradicional 1kg", precio: 12000, peso: "1kg", stock: false },
    { nombre: "REI VERDE Tradicional 1kg", precio: 8500, peso: "1kg", stock: false },
    { nombre: "REI VERDE Classica 1kg", precio: 7500, peso: "1kg", stock: false },
    { nombre: "REI VERDE Padrón Argentino 1kg", precio: 7500, peso: "1kg", stock: false },
    { nombre: "Lata Baldo", precio: 20000, peso: "Accesorio", stock: true, categoria: "Accesorios" },
    { nombre: "Yerbera de cuero", precio: 10000, peso: "Accesorio", stock: true, categoria: "Accesorios" }
];

// Imagen "de fábrica" por producto exacto
const imagenPorProducto = {
    "BALDO UY 1kg": IMAGENES.baldo_bag,
    "Lata Baldo": IMAGENES.baldo_lata,
    "ESMERALDA 1kg": IMAGENES.esmeralda,
    "REI VERDE Premium 1kg": IMAGENES.reiverde,
    "CENTENARIA 1kg": IMAGENES.centenaria,
    "CANARIAS Serena 1kg": IMAGENES.canarias_serena,
    "VERDECITA 1kg": IMAGENES.verdecita
};
// Imagen de referencia por marca (cuando no hay foto exacta del producto)
const imagenPorMarca = {
    "SARA": IMAGENES.sara
};

const productosFiltrados = productos.filter(p => !p.nombre.includes("500g"));

const marcasConocidas = [
    "REI VERDE", "Emperatriz del Monte", "CANARIAS", "CENTENARIA", "PINDARÉ",
    "VERDECITA", "BALDO", "ESMERALDA", "LATINA", "SARA", "BARÃO", "CONTIGO", "CÓSMICO"
].sort((a, b) => b.length - a.length);

function obtenerMarca(nombreProducto) {
    for (let marca of marcasConocidas) {
        if (nombreProducto.startsWith(marca + " ") || nombreProducto === marca) return marca;
    }
    return nombreProducto.split(" ")[0];
}

function obtenerImagen(p) {
    if (imagenPorProducto[p.nombre]) return imagenPorProducto[p.nombre];
    const marca = obtenerMarca(p.nombre);
    if (imagenPorMarca[marca]) return imagenPorMarca[marca];
    return null;
}

const grouped = {};
productosFiltrados.forEach(p => {
    const grupo = p.categoria || obtenerMarca(p.nombre);
    if (!grouped[grupo]) grouped[grupo] = [];
    grouped[grupo].push(p);
});

const marcasOrdenadas = Object.keys(grouped).sort((a, b) => {
    if (a === "Accesorios") return 1;
    if (b === "Accesorios") return -1;
    return a.localeCompare(b);
});

const app = document.getElementById("app");
const brandNav = document.getElementById("brandNav");
const contador = document.getElementById("contador");

let filtroActual = "todos";
let textoBusqueda = "";

function slugify(str){
    return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
}

function crearTarjeta(p){
    const card = document.createElement("div");
    card.className = "product-card" + (p.stock ? "" : " sin-stock");
    card.dataset.nombre = p.nombre.toLowerCase();
    card.dataset.stock = p.stock ? "stock" : "sin-stock";

    const badge = document.createElement("div");
    badge.className = "stock-badge" + (p.stock ? "" : " sin-stock");
    badge.textContent = p.stock ? "✅ En stock" : "❌ Sin stock";

    const imageWrap = document.createElement("div");
    imageWrap.className = "product-image-wrap";

    const imgSrc = obtenerImagen(p);
    const img = document.createElement("img");
    img.alt = `Foto de ${p.nombre}`;
    img.style.display = "none";

    if (imgSrc){
        img.src = imgSrc;
        img.style.display = "block";
    } else {
        const placeholder = document.createElement("div");
        placeholder.className = "no-photo";
        placeholder.textContent = "🧉";
        imageWrap.appendChild(placeholder);
    }
    imageWrap.appendChild(img);

    const photoInput = document.createElement("input");
    photoInput.type = "file";
    photoInput.accept = "image/*";
    photoInput.className = "photo-input";
    photoInput.title = "Elegir foto del producto";
    photoInput.addEventListener("change", event => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            img.src = e.target.result;
            img.style.display = "block";
            const ph = imageWrap.querySelector(".no-photo");
            if (ph) ph.remove();
        };
        reader.readAsDataURL(file);
    });

    card.appendChild(badge);
    card.appendChild(imageWrap);

    const info = document.createElement("div");
    info.innerHTML = `
        <div class="product-name">${p.nombre}</div>
        <div class="product-price">${p.precio.toLocaleString("es-UY")}</div>
        <div class="product-weight">${p.peso}</div>
    `;
    card.appendChild(info);
    card.appendChild(photoInput);

    return card;
}

function render(){
    app.innerHTML = "";
    brandNav.innerHTML = "";
    let totalVisibles = 0;

    marcasOrdenadas.forEach(marca => {
        const productosDeMarca = grouped[marca].filter(p => {
            const coincideTexto = p.nombre.toLowerCase().includes(textoBusqueda) || marca.toLowerCase().includes(textoBusqueda);
            const coincideFiltro = filtroActual === "todos" || (filtroActual === "stock" && p.stock) || (filtroActual === "sin-stock" && !p.stock);
            return coincideTexto && coincideFiltro;
        });

        if (productosDeMarca.length === 0) return;
        totalVisibles += productosDeMarca.length;

        const slug = slugify(marca);

        const navLink = document.createElement("a");
        navLink.href = "#" + slug;
        navLink.textContent = marca;
        brandNav.appendChild(navLink);

        const section = document.createElement("div");
        section.className = "brand-section";
        section.id = slug;

        const header = document.createElement("div");
        header.className = "brand-header";
        header.innerHTML = `
            <h2 class="brand-title">${marca}</h2>
            <span class="brand-count">${productosDeMarca.length} producto${productosDeMarca.length !== 1 ? "s" : ""}</span>
        `;
        section.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "product-grid";
        productosDeMarca.forEach(p => grid.appendChild(crearTarjeta(p)));
        section.appendChild(grid);

        app.appendChild(section);
    });

    if (totalVisibles === 0){
        app.innerHTML = `<div class="no-results">😕 No encontramos productos que coincidan con tu búsqueda.</div>`;
    }
    contador.textContent = `${totalVisibles} producto${totalVisibles !== 1 ? "s" : ""} encontrado${totalVisibles !== 1 ? "s" : ""}`;
}

document.getElementById("buscador").addEventListener("input", e => {
    textoBusqueda = e.target.value.toLowerCase().trim();
    render();
});

document.querySelectorAll("#filtros .pill").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll("#filtros .pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filtroActual = btn.dataset.filtro;
        render();
    });
});

render();
console.log(`✅ ${productosFiltrados.length} productos cargados`);
</script>
